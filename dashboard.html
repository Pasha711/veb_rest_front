<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель керування | Bean Drop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">☕ Bean Drop</a>
        <div id="auth-nav"></div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 650px;">
    <h2>🔒 Панель керування каталогом</h2>
    <p class="text-muted">Ця сторінка доступна авторизованим користувачам (зміна даних — лише для адмінів).</p>

    <div class="card mt-4 shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4">Додати нову каву</h4>
            <div id="alert-box"></div>

            <form id="add-coffee-form">
                <div class="mb-3">
                    <label class="form-label">Назва кави *</label>
                    <input type="text" id="coffee-title" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ціна (грн) *</label>
                        <input type="number" step="0.01" id="coffee-price" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Вага (грами) *</label>
                        <input type="number" id="coffee-weight" class="form-control" value="250" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Опис</label>
                    <textarea id="coffee-description" class="form-control" rows="2"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Рівень обсмаження</label>
                        <input type="text" id="coffee-roast" class="form-control" value="Середнє">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Метод обробки</label>
                        <input type="text" id="coffee-processing" class="form-control" value="Мита">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Смакові ноти</label>
                    <input type="text" id="coffee-flavor" class="form-control" value="Шоколад, горіхи">
                </div>

                <div class="mb-3">
                    <label class="form-label">Кількість на складі *</label>
                    <input type="number" id="coffee-stock" class="form-control" value="10" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Додати позицію</button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="app.js"></script>
<script>
    if (!isAuthenticated()) {
        window.location.href = 'login.html?next=dashboard.html';
    }

    $('#add-coffee-form').on('submit', async function(e) {
        e.preventDefault();
        $('#alert-box').empty();

        const payload = {
            title: $('#coffee-title').val(),
            price: parseFloat($('#coffee-price').val()),
            weight_grams: parseInt($('#coffee-weight').val(), 10),
            description: $('#coffee-description').val(),
            roast_level: $('#coffee-roast').val(),
            processing_method: $('#coffee-processing').val(),
            flavor_notes: $('#coffee-flavor').val(),
            stock_quantity: parseInt($('#coffee-stock').val(), 10),
            origin: 1
        };

        try {
            await apiCall('/coffees/', {
                method: 'POST',
                data: JSON.stringify(payload)
            });
            alert('Каву успішно додано!');
            window.location.href = 'index.html';
        } catch (err) {
            console.error("Помилка від бекенду:", err);
            
            if (err.status === 403) {
                $('#alert-box').html('<div class="alert alert-danger"><b>403 Forbidden:</b> У вас немає прав адміністратора для додавання товару!</div>');
            } else if (err.status === 400 && err.responseJSON) {
                function formatErrors(obj) {
                    let html = '<ul>';
                    for (let key in obj) {
                        let val = obj[key];
                        if (typeof val === 'object' && val !== null) {
                            html += `<li><b>${key}:</b> ${formatErrors(val)}</li>`;
                        } else {
                            html += `<li><b>${key}:</b> ${val}</li>`;
                        }
                    }
                    html += '</ul>';
                    return html;
                }

                $('#alert-box').html(`<div class="alert alert-warning"><b>Помилка валідації (400):</b>${formatErrors(err.responseJSON)}</div>`);
            } else {
                $('#alert-box').html('<div class="alert alert-danger">Помилка додавання кави. Перевірте консоль браузера та статус сервера.</div>');
            }
        }
    });
</script>
</body>
</html>
