<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід | Bean Drop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">☕ Bean Drop</a>
        <div id="auth-nav"></div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Вхід у систему</h3>
            <div id="alert-box"></div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Увійти</button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="app.js"></script>
<script>
    if (isAuthenticated()) {
        window.location.href = 'index.html';
    }

    $('#login-form').on('submit', function(e) {
        e.preventDefault();
        const username = $('#username').val();
        const password = $('#password').val();

        $.ajax({
            url: `${API_BASE_URL}/users/login/`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username, password }),
            success: function(data) {
                setTokens(data.access, data.refresh);
                localStorage.setItem('username', username);


                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get('next') || 'index.html';
                window.location.href = nextUrl;
            },
            error: function() {
                $('#alert-box').html('<div class="alert alert-danger">Невірний username або пароль!</div>');
            }
        });
    });
</script>
</body>
</html>
