<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Drop - Магазин кави</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold text-dark">☕ Bean Drop</h1>
            <p class="text-muted">Інтернет-магазин найкращих кавових зерен</p>
        </header>

        <main>
            <h2 class="mb-4">Каталог кави</h2>
            <div id="coffee-container" class="row row-cols-1 row-cols-md-3 g-4">
                <p id="loading" class="text-center text-muted">Завантаження даних з API...</p>
            </div>
        </main>
    </div>

    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $.ajax({
                url: 'http://127.0.0.1:8000/api/coffees/',
                method: 'GET',
                success: function(data) {
                    $('#loading').remove();
                    
                    if (data.length === 0) {
                        $('#coffee-container').html('<p class="text-muted">Поки немає доступної кави в каталозі.</p>');
                        return;
                    }

                    
                    data.forEach(coffee => {
                        const card = `
                            <div class="col">
                                <div class="card h-100 shadow-sm">
                                    <div class="card-body">
                                        <h5 class="card-title fw-bold">${coffee.title}</h5>
                                        <h6 class="text-primary mb-2">${coffee.price} грн / ${coffee.weight_grams}г</h6>
                                        <p class="card-text text-secondary small">${coffee.description || 'Опис відсутній.'}</p>
                                        <ul class="list-unstyled small text-muted">
                                            <li>🌍 Регіон: <b>${coffee.origin_name || 'Не вказано'}</b></li>
                                            <li>🔥 Обсмажування: ${coffee.roast_level}</li>
                                            <li>⚙️ Обробка: ${coffee.processing_method}</li>
                                            <li>👅 Ноти: ${coffee.flavor_notes}</li>
                                        </ul>
                                    </div>
                                    <div class="card-footer bg-white border-top-0 text-muted small">
                                        📦 Залишок: ${coffee.stock_quantity} шт.
                                    </div>
                                </div>
                            </div>
                        `;
                        $('#coffee-container').append(card);
                    });
                },
                error: function(err) {
                    $('#loading').html('<div class="alert alert-danger">Не вдалося завантажити дані з бекенду. Перевірте, чи запущений сервер Django на порту 8000!</div>');
                    console.error("Помилка підключення до API:", err);
                }
            });
        });
    </script>
</body>
</html>
